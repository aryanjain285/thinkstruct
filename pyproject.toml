[project]
name = "patsearch"
version = "0.1.0"
description = "Patent claim search over USPTO vehicle patent applications"
requires-python = ">=3.12"
dependencies = [
    "opensearch-py>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "openai>=1.60",
]
embeddings = ["sentence-transformers>=3.0"]
all = [
    "fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.9",
    "openai>=1.60", "sentence-transformers>=3.0", "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires a live OpenSearch index"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes — unused imports/variables, undefined names
    "I",         # import sorting
    "B",         # bugbear — likely bugs, including zip() without strict=
    "C4",        # comprehension simplifications
    "SIM",       # simplifications
    "UP",        # pyupgrade
    "RET",       # return-path clarity
]
ignore = [
    "E501",      # line length is handled by the formatter, not the linter
    "SIM108",    # ternaries are not always clearer than if/else
    "RET504",    # a named return value often documents intent
    "B008",      # FastAPI Depends()/Query() in defaults is the framework idiom
    "UP042",     # `str, Enum` is deliberate: it serialises identically on 3.11 and
                 # 3.12+, whereas StrEnum changes str() semantics
]

[tool.ruff.lint.per-file-ignores]
# Test doubles legitimately accept arguments they ignore.
"tests/*" = ["ARG001", "ARG002", "ARG005"]
# Slide layout reads better when a shape and its one-line tweak stay together.
"scripts/make_deck.py" = ["E702"]

[tool.ruff.lint.isort]
known-first-party = ["patsearch"]
