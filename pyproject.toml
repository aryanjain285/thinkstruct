[project]
name = "patsearch"
version = "0.1.0"
description = "Patent claim search over USPTO vehicle patent applications"
requires-python = ">=3.12"
dependencies = [
    "opensearch-py>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "openai>=1.60",
]
embeddings = ["sentence-transformers>=3.0"]
all = [
    "fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.9",
    "openai>=1.60", "sentence-transformers>=3.0", "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
