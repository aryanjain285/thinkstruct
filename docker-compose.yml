services:
  opensearch:
    image: opensearchproject/opensearch:3.7.0
    container_name: patsearch-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      # Local development only. Serves plain HTTP with no auth; never expose this port.
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: patsearch-api
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      - OPENSEARCH_HOST=http://opensearch:9200
      - PATSEARCH_INDEX=${PATSEARCH_INDEX:-patents}
      - PATSEARCH_EMBEDDER=${PATSEARCH_EMBEDDER:-minilm}
      - PATSEARCH_RERANKER=${PATSEARCH_RERANKER:-llm-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:8080
      - HF_HOME=/models
    volumes:
      - ./patent_data:/app/patent_data:ro
      - ./data:/app/data
      - ./reports:/app/reports
      - hf-models:/models
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  ui:
    build:
      context: ./ui
      dockerfile: ../docker/Dockerfile.ui
      args:
        VITE_API_URL: http://localhost:8000
    container_name: patsearch-ui
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"

volumes:
  opensearch-data:
  hf-models:
